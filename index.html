<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>I Love You <3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background-color: #000;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }
  h1 {
    font-family: "Comic Neue", "Comic Sans MS", "Comic Sans", cursive;
    color: red;
    font-size: 12vw;
    text-align: center;
    margin: 0;
    padding: 0 20px;
    text-shadow:
      0 0 10px rgba(255,0,0,0.8),
      0 0 25px rgba(255,0,0,0.6),
      0 0 50px rgba(255,0,0,0.4);
  }
  #cursor {
    display: inline-block;
    animation: blink 0.8s steps(1) infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
  .heart {
    position: fixed;
    pointer-events: none;
    font-size: 2rem;
    color: red;
    text-shadow: 0 0 10px rgba(255,0,0,0.8);
    animation: floatUp 1.2s ease-out forwards;
    user-select: none;
  }
  @keyframes floatUp {
    0% {
      transform: translate(-50%, -50%) scale(0.6);
      opacity: 1;
    }
    100% {
      transform: translate(-50%, -150%) scale(1.4);
      opacity: 0;
    }
  }
  #tapHint {
    position: fixed;
    bottom: 5vh;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.4);
    font-family: sans-serif;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <h1 id="msg"><span id="typed"></span><span id="cursor">|</span></h1>
  <div id="tapHint">tap anywhere ✨</div>

  <audio id="bgSong" src="song.mp3" loop></audio>

  <script>
    // ---- Typewriter effect ----
    const text = "I love you <3";
    const typedEl = document.getElementById('typed');
    let i = 0;

    // Simple typing "tick" sound using Web Audio API (no extra file needed)
    let audioCtx;
    function playTick() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = 700 + Math.random() * 100;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function typeNext() {
      if (i < text.length) {
        typedEl.textContent += text.charAt(i);
        playTick();
        i++;
        setTimeout(typeNext, 180);
      } else {
        document.getElementById('cursor').style.display = 'inline-block';
      }
    }

    // ---- Background music (starts on first tap, due to browser autoplay rules) ----
    const bgSong = document.getElementById('bgSong');
    let musicStarted = false;
    let typingStarted = false;

    function startExperience() {
      if (!musicStarted) {
        bgSong.volume = 0.5;
        bgSong.play().catch(() => {});
        musicStarted = true;
      }
      if (!typingStarted) {
        typingStarted = true;
        typeNext();
      }
    }

    // ---- Hearts on tap ----
    function spawnHeart(x, y) {
      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.textContent = '❤';
      heart.style.left = x + 'px';
      heart.style.top = y + 'px';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    }

    document.addEventListener('click', (e) => {
      startExperience();
      spawnHeart(e.clientX, e.clientY);
      document.getElementById('tapHint').style.display = 'none';
    });

    document.addEventListener('touchstart', (e) => {
      startExperience();
      for (const touch of e.touches) {
        spawnHeart(touch.clientX, touch.clientY);
      }
      document.getElementById('tapHint').style.display = 'none';
    });
  </script>
</body>
</html>
